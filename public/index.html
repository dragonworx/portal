<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">▣</span>
        <span class="brand-name">Portal</span>
        <div class="status" id="status" title="Server connection">
          <span class="dot" id="status-dot"></span>
          <span class="status-text" id="status-text">connecting…</span>
        </div>
      </div>

      <nav class="crumbs" id="crumbs" aria-label="Folder breadcrumbs"></nav>

      <div class="search">
        <input
          id="filter"
          type="search"
          placeholder="Filter this folder…"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          id="filter-clear"
          class="search-clear"
          type="button"
          title="Clear filter"
          aria-label="Clear filter"
          hidden
        >&times;</button>
      </div>

      <div class="topbar-right">
        <div class="user" id="user" hidden>
          <span class="user-email" id="user-email" title=""></span>
          <a
            href="/auth/logout"
            class="btn ghost tiny"
            id="logout-btn"
            title="Sign out"
          >Sign out</a>
        </div>
      </div>
    </header>

    <section class="toolbar">
      <div class="toolbar-left">
        <button id="btn-up" class="btn ghost" title="Go up one folder" aria-label="Up">
          <span class="icon" aria-hidden="true"></span><span class="btn-label">Up</span>
        </button>
        <span class="toolbar-sep" aria-hidden="true"></span>
        <button id="btn-newfile" class="btn ghost" title="New file" aria-label="New file">
          <span class="icon" aria-hidden="true"></span><span class="btn-label">New file</span>
        </button>
        <button id="btn-newfolder" class="btn ghost" title="New folder" aria-label="New folder">
          <span class="icon" aria-hidden="true"></span><span class="btn-label">New folder</span>
        </button>
        <label class="btn ghost upload-label" title="Upload files" aria-label="Upload files">
          <span class="icon" aria-hidden="true"></span><span class="btn-label">Upload</span>
          <input id="file-input" type="file" multiple hidden />
        </label>
        <span class="toolbar-sep" aria-hidden="true"></span>
        <button id="btn-select" class="btn ghost" title="Toggle selection mode" aria-label="Select" aria-pressed="false">
          <span class="icon" aria-hidden="true"></span><span class="btn-label">Select</span>
        </button>
        <button id="btn-copy" class="btn ghost" disabled title="Copy (⌘/Ctrl+C)" aria-label="Copy">
          <span class="icon" aria-hidden="true"></span><span class="btn-label">Copy</span>
        </button>
        <button id="btn-cut" class="btn ghost" disabled title="Cut (⌘/Ctrl+X)" aria-label="Cut">
          <span class="icon" aria-hidden="true"></span><span class="btn-label">Cut</span>
        </button>
        <button id="btn-download" class="btn primary" disabled title="Download selected" aria-label="Download">
          <span class="icon" aria-hidden="true"></span><span class="btn-label">Download</span>
        </button>
      </div>

      <div class="toolbar-right">
        <span id="selection-summary" class="muted">No items selected</span>
      </div>
    </section>

    <div class="clipboard-chip" id="clipboard-chip" hidden role="status" aria-live="polite">
      <span class="chip-icon" id="chip-icon" aria-hidden="true">✂</span>
      <span class="chip-text">
        <strong id="chip-mode">Move</strong>
        <span id="chip-summary">0 items</span>
        <span class="chip-from">from <code id="chip-from">/</code></span>
      </span>
      <div class="chip-actions">
        <button id="btn-paste" class="btn primary tiny" title="Paste into current folder (⌘/Ctrl+V)">
          <span class="icon" aria-hidden="true"></span><span class="btn-label">Paste here</span>
        </button>
        <button id="btn-clipboard-clear" class="btn ghost tiny" title="Clear (Esc)">Clear</button>
      </div>
    </div>

    <main class="listing" id="listing">
      <div class="list-header">
        <label class="cell cell-check">
          <input type="checkbox" id="select-all" />
        </label>
        <div class="cell cell-name">Name</div>
        <div class="cell cell-mtime">Modified</div>
        <div class="cell cell-actions" aria-hidden="true"></div>
        <div class="cell cell-size">Size</div>
      </div>
      <div class="viewport" id="viewport">
        <div class="spacer" id="spacer"></div>
        <div class="rows" id="rows"></div>
        <div class="empty" id="empty" hidden>This folder is empty.</div>
      </div>
    </main>

    <aside class="uploads" id="uploads" hidden>
      <header class="uploads-header">
        <span>Uploads</span>
        <button id="uploads-clear" class="btn tiny ghost">Close</button>
      </header>
      <ul id="uploads-list"></ul>
    </aside>

    <div
      class="dropzone"
      id="dropzone"
      hidden
      aria-hidden="true"
    >
      <div class="dropzone-inner">
        Drop files to upload to <strong id="dropzone-path">/</strong>
      </div>
    </div>

    <div
      class="editor-modal"
      id="editor-modal"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="editor-title"
    >
      <div class="editor-shell">
        <header class="editor-header">
          <div class="editor-title-block">
            <span class="editor-icon" aria-hidden="true">📝</span>
            <div class="editor-title-text">
              <strong id="editor-title" class="editor-path">file</strong>
              <span class="editor-subtitle">
                <span class="editor-meta" id="editor-mode">plain text</span>
                <span class="editor-meta editor-dirty" id="editor-dirty" hidden>● unsaved</span>
              </span>
            </div>
          </div>
          <div class="editor-actions">
            <button id="editor-cancel" class="btn ghost" type="button">Cancel</button>
            <button id="editor-save" class="btn primary" type="button">Save</button>
          </div>
        </header>
        <div
          class="editor-warning"
          id="editor-warning"
          hidden
          role="alert"
        >
          <span class="editor-warning-icon" aria-hidden="true">⚠</span>
          <span class="editor-warning-msg" id="editor-warning-msg"></span>
        </div>
        <div class="editor-body" id="editor-body"></div>
      </div>
    </div>

    <div
      class="editor-modal preview-modal"
      id="preview-modal"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="preview-title"
    >
      <div class="editor-shell preview-shell">
        <header class="editor-header">
          <div class="editor-title-block">
            <span class="editor-icon" id="preview-icon" aria-hidden="true">👁</span>
            <div class="editor-title-text">
              <strong id="preview-title" class="editor-path">file</strong>
              <span class="editor-subtitle">
                <span class="editor-meta" id="preview-meta">preview</span>
              </span>
            </div>
          </div>
          <div class="editor-actions">
            <button id="preview-download" class="btn ghost icon-btn" type="button" title="Download" aria-label="Download">
              <span class="icon" aria-hidden="true"></span>
            </button>
            <button id="preview-close" class="btn primary" type="button">Close</button>
          </div>
        </header>
        <div class="editor-body preview-body" id="preview-body"></div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
