services:
  portal:
    # --- Path A: build from source on this host (default). ---
    build: .

    # --- Path B: use a pre-built image (skip cloning + building). ---
    # Comment out the `build:` line above and uncomment one of these:
    # image: ghcr.io/your-org/portal:latest
    image: portal:latest

    container_name: portal
    restart: unless-stopped

    # Bind to loopback so the container is only reachable from the host
    # (i.e. only nginx-on-host can talk to it). Drop the `127.0.0.1:` prefix
    # if you want the container reachable directly from the network.
    ports:
      - "127.0.0.1:4000:4000"

    volumes:
      # Host folder served by the portal. Anything dropped here is visible
      # in the UI; uploads land here.
      - ./data:/data

    # Auth credentials and other secrets live in a host-only .env file
    # (copy .env.example to .env and fill it in). The file is excluded from
    # the image build via .dockerignore.
    env_file:
      - path: .env
        required: false

    environment:
      # Override config.json values without rebuilding. Anything in `env_file`
      # above wins over these defaults.
      PORTAL_MAX_UPLOAD_BYTES: "5368709120"  # 5 GB
      # PORTAL_PORT: "4000"
      # PORTAL_HOST: "0.0.0.0"

      # --- Google OAuth + email whitelist ---
      # Prefer setting these in `.env` (see env_file above) so secrets stay
      # out of compose. The lines below are kept as a reference of every
      # variable Portal understands.
      # PORTAL_AUTH_ENABLED: "true"
      # GOOGLE_CLIENT_ID: "xxxxxxxx.apps.googleusercontent.com"
      # GOOGLE_CLIENT_SECRET: "GOCSPX-..."
      # PORTAL_PUBLIC_URL: "https://portal.example.com"
      # PORTAL_ALLOWED_EMAILS: "alice@example.com,bob@example.com"
      # PORTAL_ALLOWED_DOMAINS: ""    # or e.g. "example.com"
      # PORTAL_SESSION_SECRET: "use `openssl rand -base64 48` and paste here"
      # PORTAL_COOKIE_SECURE: "true"  # set to "false" only for http:// dev
      # PORTAL_SESSION_TTL: "604800"  # session lifetime in seconds (default 7d)


